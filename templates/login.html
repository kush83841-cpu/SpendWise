{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="auth-card">
        <div class="auth-logo">💸</div>
        <h1>Welcome back</h1>
        <p class="muted">Log in to your SpendWise account</p>
        <form method="post" class="auth-form">
            <label>Username
                <input type="text" name="username" required autocomplete="username" />
            </label>
            <label>Password
                <input type="password" name="password" required autocomplete="current-password" />
            </label>
            <button type="submit" class="btn-primary">Log in →</button>
        </form>
        <p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>
</div>
{% endblock %}
